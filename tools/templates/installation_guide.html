<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <title>$title</title>
  <style>
    @page { size: Letter; margin: 14mm 14mm 16mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: #111; background: #fff;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 13.5pt; line-height: 1.65; font-kerning: normal;
      word-break: keep-all; overflow-wrap: break-word;
    }
    main { max-width: 720px; margin: 0 auto; padding: 28px; }
    html[lang="en"] body { font-family: "Segoe UI", "Malgun Gothic", sans-serif; word-break: normal; }
    h1 { font-size: 23pt; line-height: 1.4; margin: 0 0 20px; color: #111; }
    h2 { font-size: 17pt; line-height: 1.45; margin: 28px 0 14px; color: #111; }
    h3 { font-size: 14pt; margin: 20px 0 10px; }
    h1, h2, h3 { font-weight: 700; break-after: avoid; }
    p { margin: 0 0 15px; orphans: 3; widows: 3; }
    ul, ol { margin: 10px 0 18px; padding-left: 1.6em; }
    li { margin: 0 0 10px; orphans: 2; widows: 2; }
    li > p { margin-bottom: 8px; }
    strong { font-weight: 700; }
    a { color: #214c75; text-decoration: underline; text-underline-offset: 2px; }
    code {
      font-family: Consolas, "Malgun Gothic", monospace; font-size: .92em;
      color: #91511e; background: #f4f4f7; border-radius: 3px; padding: 1px 4px;
      overflow-wrap: anywhere;
    }
    pre {
      margin: 14px 0 20px; padding: 14px 18px; background: #f1f2f7;
      border-radius: 4px; white-space: pre-wrap; break-inside: avoid;
    }
    pre code { color: #202d58; background: none; padding: 0; }
    blockquote {
      margin: 16px 0 20px; padding: 12px 16px; border-left: 3px solid #aab4c3;
      background: #f7f8fa; font-size: 12.5pt; break-inside: avoid;
    }
    blockquote p:last-child { margin-bottom: 0; }
    hr { border: 0; border-top: 1px solid #c3cad5; margin: 24px 0; }
    @media print { main { max-width: none; margin: 0; padding: 0; } }
  </style>
</head>
<body><main>$content</main></body>
</html>
