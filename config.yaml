audio:
  auto_stop_timeout_min: 10
  channels: 1
  chunk_ms: 100
  device_index: 2
  sample_rate: 16000
church:
  default_ui_language: ko
  logo: branding/church-logo.png
  name: Starkville Korean Church
  short_name: SKC
gemini:
  auto_drift_correction: false
  context_seed: true
  fallback_model: gemini-3.5-live-translate-preview
  preferred_model: gemini-3.5-live-translate-preview
  voice: orus
logging:
  backup_count: 5
  log_dir: logs
  max_bytes: 10485760
network:
  enable_tunnel: true
  host: 0.0.0.0
  hostname: skc
  port: 8080
  public_url: https://live.starkvillekoreanchurch.org
translation:
  default_active_targets:
  - zh
  - es
  expected_source_language: en
  supported_targets:
  - en
  - uk
  - zh
  - es
