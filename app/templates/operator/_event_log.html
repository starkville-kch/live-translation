<!-- Event log (foldable, collapsed by default) -->
<div class="card">
  <h2 class="card-toggle" id="log-toggle">
    <span class="tooltip tooltip-left">
      <span data-lang="ko">이벤트 로그 (Event Log)</span>
      <span data-lang="en">Event & Activity Log</span>
      <span class="tooltiptext" data-lang="ko">오디오 연결, Gemini 세션 상태 변화, 접속자 입퇴장 등 시스템 이벤트 기록입니다. 클릭하여 펼치거나 접을 수 있습니다.</span>
      <span class="tooltiptext" data-lang="en">System event log: audio stream, Gemini session changes, attendee connections. Click to expand.</span>
    </span>
    <span class="chevron">▼</span>
  </h2>
  <div class="card-body hidden" id="log-body">
    <div id="log"><div class="log-placeholder" style="color:var(--color-text-muted); padding:3px 0;">No events yet…</div></div>
  </div>
</div>
