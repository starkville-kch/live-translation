<!-- Row 5: Session Metrics Grid (3x2 compact) -->
<div class="metrics-dashboard-grid">
  <div class="stat-card-item">
    <span class="stat-card-label tooltip">총 접속자
      <span class="tooltiptext">현재 자막/음성 스트림에 연결된 청취 기기 수입니다.</span>
    </span>
    <span class="stat-card-val" id="stat-attendees">0</span>
  </div>

  <div class="stat-card-item">
    <span class="stat-card-label tooltip">재연결
      <span class="tooltiptext">Gemini Live API 자동 재연결 횟수입니다.</span>
    </span>
    <span class="stat-card-val" id="stat-reconnects">0</span>
  </div>

  <div class="stat-card-item">
    <span class="stat-card-label tooltip">자막 수
      <span class="tooltiptext">전송 완료된 자막 문장 수입니다.</span>
    </span>
    <span class="stat-card-val" id="stat-captions">0</span>
  </div>

  <div class="stat-card-item">
    <span class="stat-card-label tooltip">체감 지연
      <span class="tooltiptext">AI 번역 및 청취자 전달까지의 추정 지연 시간입니다.</span>
    </span>
    <span class="stat-card-val" id="stat-overall-delay">—</span>
  </div>

  <div class="stat-card-item">
    <span class="stat-card-label tooltip">운영 시간
      <span class="tooltiptext">번역 서비스 시작 후 총 가동 시간입니다.</span>
    </span>
    <span class="stat-card-val" id="stat-runtime">—</span>
  </div>

  <div class="stat-card-item">
    <span class="stat-card-label tooltip">추정 비용
      <span class="tooltiptext">제미나이 API 실시간 요금 기준 추정 비용입니다.</span>
    </span>
    <span class="stat-card-val cost" id="stat-cost">—</span>
  </div>
</div>
