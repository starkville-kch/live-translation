<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>$church - 현장 Wi-Fi 통역 안내</title>
  <style>
    @page { size: A4; margin: 20mm; }
    body { margin: 0; color: #1a2a42; font-family: "Malgun Gothic", sans-serif; text-align: center; }
    main { max-width: 680px; margin: 36px auto; padding: 24px; border: 2px solid #b89445; }
    h1 { font-size: 26px; margin: 0 0 16px; overflow-wrap: anywhere; }
    h2 { font-size: 20px; margin: 12px 0; }
    img { display: block; width: 300px; max-width: 80%; height: auto; margin: 20px auto; }
    .url { font-size: 19px; overflow-wrap: anywhere; }
    p { line-height: 1.7; }
    button { padding: 10px 24px; margin: 14px; cursor: pointer; }
    .note { font-size: 13px; color: #526076; }
    @media print { button { display: none; } main { margin: 0 auto; } }
  </style>
</head>
<body>
  <button onclick="window.print()">인쇄 / Print</button>
  <main>
    <h1>$church</h1>
    <h2>실시간 통역 / Live Translation</h2>
    <p>교회 현장 Wi-Fi에 연결한 뒤 QR 코드를 스캔하세요.<br>Connect to the church Wi-Fi, then scan the QR code.</p>
    <img src="data:image/png;base64,$qr_data" alt="Local Wi-Fi attendee QR code">
    <p class="url">$local_url</p>
    <p>번역 음성을 들으려면 이어폰을 사용하세요.<br>Please use earphones for translated audio.</p>
    <p class="note">통역 프로그램이 실행 중이어야 접속할 수 있습니다.<br>The translation program must be running.</p>
  </main>
</body>
</html>
